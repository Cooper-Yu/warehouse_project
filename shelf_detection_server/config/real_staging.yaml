shelf_detection_server:
  ros__parameters:
    use_sim_time: false
    staging_only: true
    intensity_threshold: 4000.0
    min_cluster_size: 2
    max_x_difference: 0.75
    min_leg_separation: 0.25
    detection_timeout: 3.0
    target_base_frame: robot_base_footprint
    odom_topic: /odom
    odom_frame: robot_odom

    # Conservative first real staging slice. Final entry is hard-gated by
    # staging_only and these values are not an attach calibration.
    forward_speed: 0.05
    rotate_speed: 0.10
    alignment_fine_rotate_speed: 0.03
    alignment_standoff_distance: 1.00
    alignment_position_tolerance: 0.08
    alignment_retry_count: 4
    alignment_max_drive_distance: 0.40
    alignment_max_travel_yaw: 0.70
    alignment_short_drive_distance: 0.20
    alignment_short_forward_speed: 0.04
    alignment_max_reverse_distance: 0.10
    alignment_max_reverse_yaw: 0.70
    alignment_reverse_speed: 0.03
    movement_timeout: 45.0

    # Retained only to keep the full server parameter set explicit. This
    # distance is unreachable while staging_only is true.
    final_drive_distance: 0.0
