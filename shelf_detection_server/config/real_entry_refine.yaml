shelf_detection_server:
  ros__parameters:
    use_sim_time: false
    staging_only: false
    entry_only: false
    entry_refine_only: true
    target_base_frame: robot_base_footprint
    odom_topic: /odom
    odom_frame: robot_odom

    # Artifact motion_20260803T212534Z measured 0.152 + 0.151 m.
    entry_refine_required_completed_distance: 0.303
    entry_refine_confirmed_completed_distance: 0.303
    entry_refine_confirmation_tolerance: 0.01

    # Last visible x=0.823, last step=0.151, center plane=0.20:
    # 0.823 - 0.151 - 0.20 ~= 0.472 m.
    entry_refine_distance: 0.47
    entry_refine_max_distance: 0.50
    entry_refine_speed: 0.03
    entry_refine_timeout: 25.0
    entry_odom_yaw_tolerance: 0.04

    # Explicitly unreachable in entry_refine_only mode.
    final_drive_distance: 0.0
