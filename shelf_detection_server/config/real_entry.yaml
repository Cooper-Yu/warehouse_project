shelf_detection_server:
  ros__parameters:
    use_sim_time: false
    staging_only: false
    entry_only: false
    final_push_only: false
    final_push_enabled: true
    elevator_up_enabled: true
    intensity_threshold: 4000.0
    min_cluster_size: 2
    max_x_difference: 0.75
    min_leg_separation: 0.25
    detection_timeout: 3.0
    target_base_frame: robot_base_footprint
    odom_topic: /odom
    odom_frame: robot_odom

    # Entry starts only after two fresh, motionless safe-standoff samples.
    yaw_tolerance: 0.04
    alignment_standoff_distance: 1.00
    alignment_position_tolerance: 0.08
    alignment_required_consecutive_samples: 2
    entry_standoff_geometry_gate_enabled: false

    # Reuse the measured simulation stepwise approach at reduced real speed.
    forward_speed: 0.05
    forward_step_distance: 0.15
    center_distance_tolerance: 0.20
    center_lateral_tolerance: 0.03
    entry_lateral_realign_deadband: 0.08
    entry_observation_frames: 5
    entry_observation_interval: 0.05
    center_drive_speed_floor: 0.015
    center_drive_speed_ceiling: 0.05
    center_drive_error_scale: 0.20
    # Match the simulation's bounded close-range recovery: after the last
    # fresh cart_frame, use the measured remaining distance only when the
    # estimate is inside this finite window.
    center_lock_distance: 0.60
    center_lock_min_steps: 2
    center_drive_scale: 1.0
    entry_odom_yaw_tolerance: 0.04
    entry_heading_recovery_limit: 3
    entry_heading_recovery_yaw: 0.12
    entry_reverse_recovery_limit: 2
    entry_reverse_recovery_distance: 0.08
    entry_lateral_realign_limit: 3
    lateral_execution_enabled: true
    lateral_correction_limit: 3
    lateral_target_tolerance: 0.02
    lateral_correction_ratio: 0.50
    lateral_min_drive_distance: 0.005
    lateral_speed_error_floor: 0.01
    lateral_speed_error_ceiling: 0.12
    lateral_min_rotate_speed: 0.03
    lateral_min_drive_speed: 0.015
    lateral_min_temporary_yaw: 0.25
    lateral_yaw_error_gain: 5.5
    lateral_action_timeout: 25.0
    lateral_reverse_recovery_limit: 2
    lateral_reverse_recovery_distance: 0.08
    lateral_reverse_recovery_speed: 0.02
    lateral_rotate_speed: 0.03
    lateral_drive_speed: 0.02
    lateral_max_drive_distance: 0.10
    lateral_clearance_min_range: 1.00
    entry_final_standoff: 0.15
    entry_blind_step_distance: 0.15
    entry_blind_max_distance: 0.80
    movement_timeout: 90.0

    # Segmented entry reaches the calibrated final standoff; complete mode
    # stops there and proceeds directly to the elevator command.
    final_drive_distance: 0.3703
